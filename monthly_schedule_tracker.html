<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Schedule Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --text-primary: #000;
            --text-secondary: #666;
            --text-muted: #999;
            --surface-2: #fff;
            --surface-1: #f5f5f5;
            --border: #ddd;
            --border-strong: #bbb;
            --bg-accent: #e3f2fd;
            --text-accent: #1976d2;
            --bg-success: #e8f5e9;
            --text-success: #388e3c;
            --bg-warning: #fff3cd;
            --text-warning: #856404;
            --radius: 8px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-primary: #fff;
                --text-secondary: #aaa;
                --text-muted: #666;
                --surface-2: #1a1a1a;
                --surface-1: #2d2d2d;
                --border: #444;
                --border-strong: #555;
                --bg-accent: #1e3a8a;
                --text-accent: #60a5fa;
                --bg-success: #064e3b;
                --text-success: #86efac;
                --bg-warning: #664d03;
                --text-warning: #ffecb5;
            }
        }

        body {
            background: var(--surface-2);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .container {
            padding: 1rem 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 8px 12px;
            font-size: 13px;
            background: var(--surface-1);
            border: 0.5px solid var(--border-strong);
            border-radius: var(--radius);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--border);
        }

        button:active {
            transform: scale(0.98);
        }

        .month-year {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1.5rem;
            border-bottom: 0.5px solid var(--border);
            padding-bottom: 0;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 16px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: -0.5px;
        }

        .tab-btn.active {
            color: var(--text-accent);
            border-bottom-color: var(--text-accent);
            background: none;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Calendar View */
        .calendar {
            background: var(--surface-1);
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 1rem;
        }

        .weekday-label {
            text-align: center;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            padding: 8px 0;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 0.5px solid var(--border);
            border-radius: 4px;
            padding: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--surface-2);
        }

        .calendar-day:hover {
            border-color: var(--border-strong);
        }

        .calendar-day.completed {
            background: var(--bg-success);
            color: var(--text-success);
            font-weight: 600;
            border-color: var(--text-success);
        }

        .calendar-day.partial {
            background: var(--bg-warning);
            color: var(--text-warning);
            font-weight: 600;
            border-color: var(--text-warning);
        }

        .calendar-day.today {
            border: 2px solid var(--text-accent);
        }

        .calendar-day.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .day-number {
            font-size: 13px;
            font-weight: 600;
        }

        .day-check {
            font-size: 10px;
            margin-top: 2px;
        }

        /* Habit List View */
        .habits-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .habit-card {
            background: var(--surface-1);
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
        }

        .habit-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
        }

        .habit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(30px, 1fr));
            gap: 4px;
        }

        .habit-day {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0.5px solid var(--border);
            border-radius: 3px;
            font-size: 10px;
            cursor: pointer;
            background: var(--surface-2);
            transition: all 0.2s;
        }

        .habit-day:hover {
            border-color: var(--border-strong);
        }

        .habit-day.done {
            background: var(--text-success);
            color: white;
            font-weight: 600;
            border-color: var(--text-success);
        }

        .habit-day.partial {
            background: var(--text-warning);
            color: white;
            font-weight: 600;
            border-color: var(--text-warning);
        }

        .habit-stats {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-number {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Stats View */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--surface-1);
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            text-align: center;
        }

        .stat-card-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .stat-card-value {
            font-size: 32px;
            font-weight: 600;
            color: var(--text-accent);
        }

        .stat-card-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface-2);
            border-radius: var(--radius);
            padding: 1.5rem;
            max-width: 400px;
            width: 90%;
            border: 0.5px solid var(--border);
        }

        .modal-header {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .modal-tasks {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 60vh;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 4px;
            background: var(--surface-1);
            cursor: pointer;
        }

        .task-item:hover {
            background: var(--border);
        }

        .task-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .task-label {
            font-size: 13px;
            flex: 1;
        }

        .task-item.completed .task-label {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .calendar-grid {
                gap: 4px;
            }

            .habit-grid {
                gap: 2px;
            }

            .habit-day {
                width: 24px;
                height: 24px;
                font-size: 9px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Monthly Tracker</h1>
            <div class="nav-buttons">
                <button onclick="previousMonth()">← Prev</button>
                <button onclick="currentMonth()">Today</button>
                <button onclick="nextMonth()">Next →</button>
            </div>
        </div>

        <div class="month-year" id="monthYear">October 2024</div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('calendar')">Calendar</button>
            <button class="tab-btn" onclick="switchTab('habits')">Habits</button>
            <button class="tab-btn" onclick="switchTab('stats')">Stats</button>
        </div>

        <!-- Calendar Tab -->
        <div id="calendar" class="tab-content active">
            <div class="calendar">
                <div class="calendar-header">
                    <div class="weekday-label">Sun</div>
                    <div class="weekday-label">Mon</div>
                    <div class="weekday-label">Tue</div>
                    <div class="weekday-label">Wed</div>
                    <div class="weekday-label">Thu</div>
                    <div class="weekday-label">Fri</div>
                    <div class="weekday-label">Sat</div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
        </div>

        <!-- Habits Tab -->
        <div id="habits" class="tab-content">
            <div class="habits-list" id="habitsList"></div>
        </div>

        <!-- Stats Tab -->
        <div id="stats" class="tab-content">
            <div class="stats-grid" id="statsGrid"></div>
        </div>
    </div>

    <!-- Modal for daily tracking -->
    <div class="modal" id="dayModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-header" id="modalHeader">October 7</div>
            <div class="modal-tasks" id="modalTasks"></div>
        </div>
    </div>

    <script>
        const TASKS = [
            "Morning Wakeup",
            "Drink Milk & Fresh up",
            "Interview preparation",
            "Yoga",
            "News",
            "Get ready & Eat",
            "Work",
            "Shri Rama",
            "AI Learn",
            "Social Media",
            "Sleep"
        ];

        let currentDate = new Date();
        let trackingData = JSON.parse(localStorage.getItem('trackingData')) || {};
        let selectedDay = null;

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'calendar') renderCalendar();
            if (tabName === 'habits') renderHabits();
            if (tabName === 'stats') renderStats();
        }

        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
            updateMonthYear();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
            updateMonthYear();
        }

        function currentMonth() {
            currentDate = new Date();
            renderCalendar();
            updateMonthYear();
        }

        function updateMonthYear() {
            const options = { month: 'long', year: 'numeric' };
            document.getElementById('monthYear').textContent = currentDate.toLocaleDateString('en-US', options);
        }

        function getDateKey(date) {
            return date.toISOString().split('T')[0];
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startingDayOfWeek = firstDay.getDay();

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            // Empty cells for days before month starts
            for (let i = 0; i < startingDayOfWeek; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day empty';
                grid.appendChild(emptyCell);
            }

            // Days of month
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const dateKey = getDateKey(date);
                const dayCell = document.createElement('div');
                dayCell.className = 'calendar-day';
                
                const data = trackingData[dateKey] || { completed: 0, total: TASKS.length };
                
                if (date.toDateString() === today.toDateString()) {
                    dayCell.classList.add('today');
                }

                if (data.completed === data.total && data.total > 0) {
                    dayCell.classList.add('completed');
                    dayCell.innerHTML = `<div class="day-number">${day}</div><div class="day-check">✓</div>`;
                } else if (data.completed > 0) {
                    dayCell.classList.add('partial');
                    dayCell.innerHTML = `<div class="day-number">${day}</div><div class="day-check">${data.completed}</div>`;
                } else {
                    dayCell.innerHTML = `<div class="day-number">${day}</div>`;
                }

                dayCell.onclick = () => openDayModal(date);
                grid.appendChild(dayCell);
            }
        }

        function openDayModal(date) {
            selectedDay = date;
            const dateKey = getDateKey(date);
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('modalHeader').textContent = date.toLocaleDateString('en-US', options);

            const data = trackingData[dateKey] || { tasks: {} };
            const tasksHtml = TASKS.map((task, idx) => {
                const isCompleted = data.tasks && data.tasks[task];
                return `
                    <label class="task-item ${isCompleted ? 'completed' : ''}">
                        <input type="checkbox" class="task-checkbox" ${isCompleted ? 'checked' : ''} 
                               onchange="updateTask('${dateKey}', '${task}', this.checked)">
                        <span class="task-label">${task}</span>
                    </label>
                `;
            }).join('');

            document.getElementById('modalTasks').innerHTML = tasksHtml;
            document.getElementById('dayModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('dayModal').classList.remove('active');
        }

        function updateTask(dateKey, task, isChecked) {
            if (!trackingData[dateKey]) {
                trackingData[dateKey] = { tasks: {} };
            }
            
            if (isChecked) {
                trackingData[dateKey].tasks[task] = true;
            } else {
                delete trackingData[dateKey].tasks[task];
            }

            const completed = Object.keys(trackingData[dateKey].tasks).length;
            trackingData[dateKey].completed = completed;
            trackingData[dateKey].total = TASKS.length;

            localStorage.setItem('trackingData', JSON.stringify(trackingData));
            renderCalendar();
            renderHabits();
            renderStats();
        }

        function renderHabits() {
            const habitsList = document.getElementById('habitsList');
            habitsList.innerHTML = '';

            TASKS.forEach(task => {
                const card = document.createElement('div');
                card.className = 'habit-card';

                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const lastDay = new Date(year, month + 1, 0).getDate();

                let habitGrid = '';
                for (let day = 1; day <= lastDay; day++) {
                    const date = new Date(year, month, day);
                    const dateKey = getDateKey(date);
                    const data = trackingData[dateKey] || { tasks: {} };
                    const isDone = data.tasks && data.tasks[task];
                    
                    habitGrid += `<div class="habit-day ${isDone ? 'done' : ''}" onclick="toggleHabit('${dateKey}', '${task}', this)">${day}</div>`;
                }

                const completedDays = Object.keys(trackingData).filter(dateKey => {
                    const date = new Date(dateKey);
                    return date.getMonth() === month && date.getFullYear() === year && 
                           trackingData[dateKey].tasks && trackingData[dateKey].tasks[task];
                }).length;

                card.innerHTML = `
                    <div class="habit-name">${task}</div>
                    <div class="habit-grid">${habitGrid}</div>
                    <div class="habit-stats">
                        <div class="stat">
                            <div class="stat-number">${completedDays}</div>
                            <div>days done</div>
                        </div>
                        <div class="stat">
                            <div class="stat-number">${Math.round((completedDays / lastDay) * 100)}%</div>
                            <div>completion</div>
                        </div>
                    </div>
                `;

                habitsList.appendChild(card);
            });
        }

        function renderStats() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const lastDay = new Date(year, month + 1, 0).getDate();

            let totalCompleted = 0;
            let daysWithTasks = 0;
            let perfectDays = 0;

            Object.keys(trackingData).forEach(dateKey => {
                const date = new Date(dateKey);
                if (date.getMonth() === month && date.getFullYear() === year) {
                    const data = trackingData[dateKey];
                    if (data.completed > 0) {
                        daysWithTasks++;
                        totalCompleted += data.completed;
                    }
                    if (data.completed === data.total && data.total > 0) {
                        perfectDays++;
                    }
                }
            });

            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-card-label">Perfect Days</div>
                    <div class="stat-card-value">${perfectDays}</div>
                    <div class="stat-card-sub">All tasks completed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Active Days</div>
                    <div class="stat-card-value">${daysWithTasks}</div>
                    <div class="stat-card-sub">Days tracked</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Total Tasks Done</div>
                    <div class="stat-card-value">${totalCompleted}</div>
                    <div class="stat-card-sub">Out of ${lastDay * TASKS.length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Completion Rate</div>
                    <div class="stat-card-value">${Math.round((totalCompleted / (lastDay * TASKS.length)) * 100)}%</div>
                    <div class="stat-card-sub">This month</div>
                </div>
            `;
        }

        function toggleHabit(dateKey, task, element) {
            if (element.classList.contains('done')) {
                element.classList.remove('done');
                updateTask(dateKey, task, false);
            } else {
                element.classList.add('done');
                updateTask(dateKey, task, true);
            }
        }

        // Close modal on outside click
        document.getElementById('dayModal').addEventListener('click', (e) => {
            if (e.target.id === 'dayModal') closeModal();
        });

        // Initialize
        updateMonthYear();
        renderCalendar();
    </script>
</body>
</html>
